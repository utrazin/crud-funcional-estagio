<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Produtos e Vendas</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/products.css" />
  <link rel="stylesheet" href="/css/sales.css" />
</head>
<body>

  <header>
    <h1>Gestão de Produtos e Vendas</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('products')">Produtos</button>
    <button class="tab-btn" onclick="switchTab('sales')">Vendas</button>
  </div>

  <div id="tab-products" class="tab-content active">
    <div class="card">
      <h2 id="product-form-title">Novo Produto</h2>

      <div id="products-msg" class="msg"></div>

      <form id="product-form" onsubmit="handleProductSubmit(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="product-name">Nome *</label>
            <input type="text" id="product-name" placeholder="Nome do produto" required />
          </div>
          <div class="form-group">
            <label for="product-price">Preço (R$) *</label>
            <input type="number" id="product-price" placeholder="0.00" step="0.01" min="0.01" required />
          </div>
          <div class="form-group">
            <label for="product-stock">Estoque *</label>
            <input type="number" id="product-stock" placeholder="0" min="0" required />
          </div>
          <div class="form-group">
            <label for="product-description">Descrição</label>
            <input type="text" id="product-description" placeholder="Opcional" />
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
            <div style="display:flex;gap:8px;">
              <button type="submit" id="product-submit-btn" class="btn btn-primary">Cadastrar</button>
              <button type="button" id="product-cancel-btn" class="btn btn-secondary" onclick="cancelEditProduct()" style="display:none;">Cancelar</button>
            </div>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Lista de Produtos</h2>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Vendas</th>
            <th>Descrição</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="products-tbody">
          <tr><td colspan="6" class="loading">Carregando...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <div id="tab-sales" class="tab-content">
    <div class="card">
      <h2>Registrar Venda</h2>

      <div id="sales-msg" class="msg"></div>

      <form id="sale-form" onsubmit="handleSaleSubmit(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="sale-product">Produto *</label>
            <select id="sale-product" onchange="onProductChange()" required>
              <option value="">Selecione um produto</option>
            </select>
          </div>
          <div class="form-group">
            <label for="sale-customer">Cliente *</label>
            <select id="sale-customer" required>
              <option value="">Selecione um cliente</option>
            </select>
          </div>
          <div class="form-group">
            <label for="sale-quantity">Quantidade *</label>
            <input type="number" id="sale-quantity" placeholder="1" min="1" value="1" oninput="updateTotalValue()" required />
          </div>
          <div class="form-group">
            <label for="sale-unit-price">Valor Unitário (R$) *</label>
            <input type="number" id="sale-unit-price" placeholder="0.00" step="0.01" min="0.01" oninput="updateTotalValue()" required />
          </div>
          <div class="form-group">
            <label for="sale-date">Data da Venda *</label>
            <input type="date" id="sale-date" required />
          </div>
        </div>

        <div class="sale-form-footer">
          <div class="sale-total">
            <strong>Valor Total:</strong>
            <span id="sale-total-display" class="sale-total__value">R$ 0,00</span>
          </div>
          <button type="submit" class="btn btn-primary">Registrar Venda</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Lista de Vendas</h2>
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Produto</th>
            <th>Cliente</th>
            <th>Qtd</th>
            <th>Valor Unit.</th>
            <th>Valor Total</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="sales-tbody">
          <tr><td colspan="7" class="loading">Carregando...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/sales.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.classList.remove('active')
      })
      document.querySelectorAll('.tab-content').forEach(function(content) {
        content.classList.remove('active')
      })
      document.getElementById('tab-' + tab).classList.add('active')
      event.target.classList.add('active')

      if (tab === 'sales') {
        document.getElementById('sale-date').value = todayISO()
        populateCustomerSelect()
        populateProductSelect()
        loadSales()
      }
    }

    function showMsg(elementId, text, type) {
      var el = document.getElementById(elementId)
      el.textContent = text
      el.className = 'msg ' + type
      el.style.display = text ? 'block' : 'none'

      if (text && type === 'success') {
        setTimeout(function() {
          el.style.display = 'none'
        }, 3000)
      }
    }

    loadProducts()
  </script>

</body>
</html>
